name: Nettoyage des branches de diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for b in diag diag-results diag-r72 diag-x86; do
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" --delete "$b" && echo "$b supprimée" || echo "$b : déjà absente"
          done
